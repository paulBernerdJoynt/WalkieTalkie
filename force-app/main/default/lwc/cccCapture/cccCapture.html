<template>
    <lightning-card title="CCC Capture" icon-name="standard:work_order_item">
        <div class="slds-card__body slds-card__body_inner">

            <!-- IDLE: choose mode before recording -->
            <template lwc:if={isIdle}>
                <p class="slds-text-body_regular slds-m-bottom_medium">
                    Record your CCC narrative, then choose how to proceed.
                </p>
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-button
                            label="Review Transcript First"
                            variant="neutral"
                            icon-name="utility:record"
                            onclick={handleRecordWithReview}
                            class="slds-button_stretch">
                        </lightning-button>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                            See what was heard before extracting CCC
                        </p>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                        <lightning-button
                            label="Record &amp; Extract CCC"
                            variant="brand"
                            icon-name="utility:record"
                            onclick={handleRecordDirect}
                            class="slds-button_stretch">
                        </lightning-button>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                            Transcribe and extract in one step
                        </p>
                    </div>
                </div>
            </template>

            <!-- RECORDING -->
            <template lwc:elseif={isRecording}>
                <div class="slds-align_absolute-center slds-p-around_large slds-has-flexi-truncate">
                    <div class="slds-text-align_center">
                        <div class="slds-m-bottom_medium">
                            <lightning-icon
                                icon-name="utility:record"
                                variant="error"
                                size="large">
                            </lightning-icon>
                        </div>
                        <p class="slds-text-heading_small slds-text-color_error slds-m-bottom_large">
                            Recording…
                        </p>
                        <lightning-button
                            label="Stop Recording"
                            variant="destructive"
                            onclick={handleStopRecording}>
                        </lightning-button>
                    </div>
                </div>
            </template>

            <!-- TRANSCRIBING spinner -->
            <template lwc:elseif={isTranscribing}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Transcribing audio…" size="medium"></lightning-spinner>
                    <p class="slds-m-top_large slds-text-align_center slds-text-color_weak">
                        Transcribing audio…
                    </p>
                </div>
            </template>

            <!-- TRANSCRIPT_REVIEW -->
            <template lwc:elseif={isTranscriptReview}>
                <p class="slds-text-title_caps slds-m-bottom_x-small">Transcript</p>
                <lightning-textarea
                    label=""
                    value={transcript}
                    onchange={handleTranscriptChange}
                    max-length="32768"
                    class="slds-m-bottom_medium">
                </lightning-textarea>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                    Review and edit if needed, then extract.
                </p>
                <div class="slds-button-group">
                    <lightning-button
                        label="Extract CCC"
                        variant="brand"
                        onclick={handleExtractCCC}
                        disabled={isTranscriptBlank}>
                    </lightning-button>
                    <lightning-button
                        label="Re-record"
                        variant="neutral"
                        onclick={handleReRecord}>
                    </lightning-button>
                </div>
            </template>

            <!-- EXTRACTING spinner -->
            <template lwc:elseif={isExtracting}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Extracting CCC…" size="medium"></lightning-spinner>
                    <p class="slds-m-top_large slds-text-align_center slds-text-color_weak">
                        Extracting Complaint, Cause &amp; Correction…
                    </p>
                </div>
            </template>

            <!-- SUCCESS -->
            <template lwc:elseif={isSuccess}>
                <div class="slds-m-bottom_small">
                    <lightning-icon
                        icon-name="utility:success"
                        variant="success"
                        size="x-small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    <span class="slds-text-color_success slds-text-body_regular">
                        CCC saved to Work Order
                    </span>
                </div>
                <dl class="slds-dl_horizontal slds-m-top_medium">
                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Complaint</dt>
                    <dd class="slds-dl_horizontal__detail">{result.complaint}</dd>

                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Cause</dt>
                    <dd class="slds-dl_horizontal__detail">{result.cause}</dd>

                    <dt class="slds-dl_horizontal__label slds-text-title_caps">Correction</dt>
                    <dd class="slds-dl_horizontal__detail">{result.correction}</dd>
                </dl>
                <div class="slds-m-top_medium slds-button-group">
                    <lightning-button label="Done"      variant="brand"    onclick={handleDone}></lightning-button>
                    <lightning-button label="New Entry" variant="neutral"  onclick={handleReset}></lightning-button>
                </div>
            </template>

            <!-- ERROR -->
            <template lwc:elseif={isError}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <lightning-icon icon-name="utility:error" size="x-small" class="slds-m-right_x-small">
                    </lightning-icon>
                    {errorMessage}
                </div>
                <div class="slds-m-top_medium">
                    <lightning-button label="Try Again" variant="neutral" onclick={handleReset}></lightning-button>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
